<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suncat // Canvas Terminal</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #050505; /* Deep background behind the canvas */
            overflow: hidden; /* Prevent scrolling */
        }
        canvas {
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

<canvas id="c"></canvas>

<script src="/socket.io/socket.io.js"></script>

<script>
    // ==========================================
    // SYSTEM STATE & DATA
    // ==========================================
    const socket = io();
    let latestSignal = {
        symbol: '---',
        price: '---',
        decision: 'AWAITING',
        confidence: '--',
        reasoning: 'Initializing connection to Alpha Engine...',
        wallet: {
            availableCash: 20.00,
            activeInvestments: {}
        }
    };

    socket.on('new_signal', (data) => {
        latestSignal = data;
        // Fallback guard if the backend hasn't emitted a wallet frame yet
        if (!latestSignal.wallet) {
            latestSignal.wallet = { availableCash: 20.00, activeInvestments: {} };
        }
    });

    // ==========================================
    // CANVAS ENGINE VARIABLES
    // ==========================================
    var canvas = document.getElementById("c");
    var ctx = canvas.getContext("2d");
    var wX = 0, wY = 0; // window length/height
    var tL = 0, tH = 0; // table length/height
    var tX = 0, tY = 0; // table top-left offsets
    
    // ==========================================
    // CORE ENGINE FUNCTIONS
    // ==========================================
    function resizeCanvas() {
        var dpr = window.devicePixelRatio || 1;
        wX = window.innerWidth;
        wY = window.innerHeight;

        canvas.width = wX * dpr;
        canvas.height = wY * dpr;
        canvas.style.width = wX + "px";
        canvas.style.height = wY + "px";
        ctx.scale(dpr, dpr);

        tX = wX; 
        tY = wY; 

        if (tX % 2 !== 0) tX--;
        if (tY % 2 !== 0) tY--;
        
        // Lock to 1:1 Aspect Ratio
        if (tX > tY) tX = tY;
        else if (tY > tX) tY = tX;

        var dX = wX - tX;
        var dY = wY - tY;
        tL = tX;
        tH = tY;

        // Center the 10x10 table
        tX = dX / 2;
        tY = dY / 2;
    }

    function drawShape(shape, x, y, z, x1, y1, x2, y2, x3, y3, x4, y4, color, fill, x5 = 0, y5 = 0) {
        let lx1 = 0, ly1 = 0, lx2 = 0, ly2 = 0, lx3 = 0, ly3 = 0, lx4 = 0, ly4 = 0;
        let lDiv = (tL / 10) * z;
        let hDiv = (tH / 10) * z;
        x = tX + (tL / 10) * x;
        y = tY + (tH / 10) * y;

        ctx.fillStyle = color;
        ctx.strokeStyle = color;
        ctx.beginPath();

        switch (shape) {
            case 'rec':
                lx1 = x + (lDiv * x1); ly1 = y + (hDiv * y1);
                lx2 = (lDiv * x2);     ly2 = (hDiv * y2);
                ctx.rect(lx1, ly1, lx2, ly2);
                break;
            case 'lin':
                lx1 = x + (lDiv * x1); ly1 = y + (hDiv * y1);
                lx2 = x + (lDiv * x2); ly2 = y + (hDiv * y2);
                ctx.moveTo(lx1, ly1);
                ctx.lineTo(lx2, ly2);
                break;
        }
        if (fill > 0) ctx.fill(); else ctx.stroke();
    }

    function drawText(x, y, boxW, boxH, text, color, z, align = 'left') {
        if (text === undefined || text === null) text = "---";
        var drawX = tX + (tL / 10) * x; 
        var drawY = tY + (tH / 10) * y;
        var maxWidth = (tL / 10) * boxW * z;
        var maxHeight = (tH / 10) * boxH * z;

        var fs = maxHeight; 
        ctx.textBaseline = "hanging";
        
        function getWrappedLines(ctx, text, limit) {
            var words = text.toString().split(" ");
            var lines = [];
            var currentLine = words[0];

            for (var i = 1; i < words.length; i++) {
                var word = words[i];
                var width = ctx.measureText(currentLine + " " + word).width;
                if (width < limit) {
                    currentLine += " " + word;
                } else {
                    lines.push(currentLine);
                    currentLine = word;
                }
            }
            lines.push(currentLine);
            return lines;
        }

        var linesArr = [];
        var fitFound = false;
        
        while (!fitFound && fs > 1) {
            ctx.font = fs + "px Courier New, monospace";
            linesArr = getWrappedLines(ctx, text, maxWidth);
            if ((linesArr.length * fs) > maxHeight) {
                fs = fs * 0.95; 
            } else {
                fitFound = true;
            }
        }

        var lineHeight = maxHeight / linesArr.length;
        ctx.fillStyle = color;
        
        for (let i = 0; i < linesArr.length; i++) {
            let lineStr = linesArr[i];
            let yLine = drawY + (i * lineHeight);
            let centerOffset = 0;
            
            if (align === 'center') {
                let lineWidth = ctx.measureText(lineStr).width;
                centerOffset = (maxWidth - lineWidth) / 2;
                if (centerOffset < 0) centerOffset = 0;
            }
            ctx.fillText(lineStr, drawX + centerOffset, yLine);
        }
    }

    // ==========================================
    // UI BUTTON CLASS
    // ==========================================
    class btn {
        constructor() {
            this.isPressed = false;
            this.isActive = true; 
        }

        show(x, y, z, l, h, text, type = 'neon') {
            this.x = x; this.y = y; this.z = z; this.l = l; this.h = h; this.text = text;
            
            if (type === 'neon') {
                let glowSize = this.isPressed ? 0.06 * this.z : 0.02 * this.z;
                let glowColor = this.isActive ? '#00ff00' : '#ff3333'; 
                if (this.isPressed) glowColor = '#ffffff'; 

                drawShape('rec', this.x - glowSize/2, this.y - glowSize/2, this.z, 0, 0, this.l + glowSize, this.h + glowSize, 0,0,0,0, glowColor, 1);
                drawShape('rec', this.x, this.y, this.z, 0, 0, this.l, this.h, 0,0,0,0, '#111', 1);
                drawText(this.x, this.y + (this.h*0.2), this.l, this.h*0.6, this.isActive ? "SYSTEM ONLINE" : "SYSTEM OFFLINE", glowColor, this.z, 'center');
            }
        }

        isTouched(tx, ty) {
            let buffer = 0.05; 
            let xMin = this.x - buffer;
            let xMax = this.x + (this.l * this.z) + buffer;
            let yMin = this.y - buffer;
            let yMax = this.y + (this.h * this.z) + buffer;

            return (tx >= xMin && tx <= xMax && ty >= yMin && ty <= yMax);
        }

        press() {
            this.isPressed = true;
            this.isActive = !this.isActive; 
            socket.emit('toggle_system', { active: this.isActive });

            setTimeout(() => { this.isPressed = false; }, 200);
        }
    }
    
    let sysBtn = new btn();

    // ==========================================
    // EVENT LISTENERS & INPUT HANDLING
    // ==========================================
    window.addEventListener('resize', resizeCanvas, false);
    window.addEventListener("orientationchange", function() { setTimeout(resizeCanvas, 200); }, false);
    
    let lastInputTime = 0;

    function handleInput(e) {
        const now = Date.now();
        if (now - lastInputTime < 100) return; 
        lastInputTime = now;

        const clientX = e.clientX;
        const clientY = e.clientY;

        const pos = {
            x: clientX - (wX - tL) / 2,
            y: clientY - (wY - tH) / 2
        };

        const gridPos = {
            x: pos.x / (tL / 10),
            y: pos.y / (tH / 10)
        };

        if (sysBtn.isTouched(gridPos.x, gridPos.y)) {
            sysBtn.press();
            return;
        }
    }

    window.addEventListener('pointerdown', handleInput, { passive: false });

    // ==========================================
    // THE RENDER LOOP
    // ==========================================
    function drawField() {
        // 1. Draw Padding (Outside the 10x10 grid)
        ctx.fillStyle = "#050505";
        ctx.fillRect(0, 0, wX, wY);

        // 2. Draw Table Background (The 10x10 grid)
        ctx.fillStyle = "#0a0a0a";
        ctx.fillRect(tX, tY, tL, tH);

        // 3. UI Border
        drawShape('rec', 0, 0, 1, 0, 0, 10, 10, 0,0,0,0, '#ff3333', 0);

        // --- HEADER ---
        drawText(0, 0.4, 10, 0.6, "SUNCAT // COGNITIVE ALGO TESTING MATRIX", "#ff3333", 1, 'center');
        drawShape('lin', 2, 1.1, 1, 0, 0, 6, 0, 0,0,0,0, '#333', 0);

        // --- PANEL 1: TARGET DATA ---
        drawShape('rec', 0.5, 1.5, 1, 0, 0, 4.25, 2.3, 0,0,0,0, '#111', 1);
        drawText(0.7, 1.7, 3.8, 0.3, "SCANNING TARGET:", "gray", 1, 'left');
        drawText(0.7, 2.1, 3.8, 0.5, latestSignal.symbol, "white", 1, 'left');
        
        drawText(0.7, 2.8, 3.8, 0.3, "MARKET VALUE:", "gray", 1, 'left');
        drawText(0.7, 3.2, 3.8, 0.45, "$" + latestSignal.price, "#00ffff", 1, 'left');

        // --- PANEL 2: WALLET & PORTFOLIO ---
        drawShape('rec', 0.5, 3.8, 9, 2.4, 0,0,0,0,0,0,0, '#111', 1);
        drawText(0.7, 4.2, 4.0, 0.4, "PORTFOLIO NAV:", "gray", 1, 'left');
        
        // Calculate Total Net Asset Value (Cash + Active Investments)
        let totalInvested = 0;
        let positions = Object.keys(latestSignal.wallet.activeInvestments);
        positions.forEach(ticker => {
            totalInvested += latestSignal.wallet.activeInvestments[ticker];
        });
        let totalNAV = latestSignal.wallet.availableCash + totalInvested;

        // Display Total NAV
        drawText(3.2, 4.2, 4.0, 0.4, "$" + totalNAV.toFixed(2), "#00ff00", 1, 'left');

        // Display Available Cash
        drawText(0.7, 4.7, 4.0, 0.3, "AVAILABLE CASH:", "gray", 1, 'left');
        drawText(2.6, 4.7, 4.0, 0.3, "$" + latestSignal.wallet.availableCash.toFixed(2), "#fff", 1, 'left');

        drawText(0.7, 5.3, 4.0, 0.3, "ACTIVE REGISTRY:", "gray", 1, 'left');
        
        if (positions.length === 0) {
            drawText(2.6, 5.3, 4.0, 0.3, "[ CASH RISK-OFF ]", "#777", 1, 'left');
        } else {
            let positionString = positions.map(ticker => `${ticker}: $${latestSignal.wallet.activeInvestments[ticker].toFixed(2)}`).join(" | ");
            drawText(2.6, 5.3, 7.0, 0.3, positionString, "#d4af37", 1, 'left');
        }

        // --- PANEL 4: REASONING ---
        drawShape('rec', 0.5, 6.4, 1, 0, 0, 9, 2.1, 0,0,0,0, '#111', 1);
        drawText(0.7, 6.6, 8.6, 0.3, "ENGINE STRATEGIC RATIONALE:", "#d4af37", 1, 'left');
        drawText(0.7, 7.0, 8.6, 1.2, latestSignal.reasoning, "white", 1, 'left');

        // --- STATUS BUTTON ---
        sysBtn.show(3, 8.8, 1, 4, 0.8, "SYSTEM ONLINE", 'neon');

        requestAnimationFrame(drawField);
    }

    // ==========================================
    // INITIALIZATION
    // ==========================================
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas(); 
    requestAnimationFrame(drawField); 

</script>
</body>
</html>
